<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1400"><rect width="1800" height="1400" fill="#102027"/><text x="75" y="114" font-family="Georgia" font-size="54" fill="#d7bb7b">THE FIRST TESTAMENT</text><text x="78" y="167" font-family="Arial" font-size="27" fill="#b4c2c0">Schema editoriale: sapere originario consultabile, non un libro fisico esterno.</text><rect x="75" y="225" width="510" height="770" rx="12" fill="#172e35" stroke="#d7bb7b" stroke-width="2"/><text x="105" y="289" font-family="Georgia" font-size="29" fill="#d7bb7b">CORPUS ORIGINARIO</text><text x="110" y="354" font-family="Arial" font-size="24" fill="#eee9dd">1. 23 Effigi e sette stadi</text><text x="110" y="414" font-family="Arial" font-size="24" fill="#eee9dd">2. Principi di incorporazione</text><text x="110" y="450" font-family="Arial" font-size="24" fill="#eee9dd">e avanzamento</text><text x="110" y="510" font-family="Arial" font-size="24" fill="#eee9dd">3. Roots e integrazioni</text><text x="110" y="570" font-family="Arial" font-size="24" fill="#eee9dd">4. Corpo, spirito e continuità</text><text x="110" y="630" font-family="Arial" font-size="24" fill="#eee9dd">5. Confini e incompatibilità</text><text x="110" y="690" font-family="Arial" font-size="24" fill="#eee9dd">6. Metodi di contesa e</text><text x="110" y="726" font-family="Arial" font-size="24" fill="#eee9dd">diagnosi</text><text x="110" y="894" font-family="Arial" font-size="24" fill="#eee9dd">Conoscere una capacità non</text><text x="110" y="930" font-family="Arial" font-size="24" fill="#eee9dd">significa possederla.</text><rect x="625" y="225" width="525" height="370" rx="12" fill="#172e35" stroke="#d7bb7b" stroke-width="2"/><text x="650" y="284" font-family="Georgia" font-size="29" fill="#d7bb7b">Richiamo immediato</text><text x="650" y="347" font-family="Arial" font-size="27" fill="#eee9dd">Recupera una nozione tecnica già</text><text x="650" y="387" font-family="Arial" font-size="27" fill="#eee9dd">padroneggiata. Non richiede una</text><text x="650" y="427" font-family="Arial" font-size="27" fill="#eee9dd">scena rituale per ogni ricordo.</text><rect x="1190" y="225" width="525" height="370" rx="12" fill="#172e35" stroke="#d7bb7b" stroke-width="2"/><text x="1215" y="284" font-family="Georgia" font-size="29" fill="#d7bb7b">Consultazione mirata</text><text x="1215" y="347" font-family="Arial" font-size="27" fill="#eee9dd">Confronta più rapporti tecnici,</text><text x="1215" y="387" font-family="Arial" font-size="27" fill="#eee9dd">dedicando al problema</text><text x="1215" y="427" font-family="Arial" font-size="27" fill="#eee9dd">l’attenzione necessaria.</text><rect x="625" y="625" width="525" height="370" rx="12" fill="#172e35" stroke="#d7bb7b" stroke-width="2"/><text x="650" y="684" font-family="Georgia" font-size="29" fill="#d7bb7b">Diagnosi applicata</text><text x="650" y="747" font-family="Arial" font-size="27" fill="#eee9dd">Applica il sapere a osservazioni</text><text x="650" y="787" font-family="Arial" font-size="27" fill="#eee9dd">reali. La conclusione dipende</text><text x="650" y="827" font-family="Arial" font-size="27" fill="#eee9dd">dai dati e dagli accessi</text><text x="650" y="867" font-family="Arial" font-size="27" fill="#eee9dd">disponibili.</text><rect x="1190" y="625" width="525" height="370" rx="12" fill="#172e35" stroke="#d7bb7b" stroke-width="2"/><text x="1215" y="684" font-family="Georgia" font-size="29" fill="#d7bb7b">Rappresentazione esterna</text><text x="1215" y="747" font-family="Arial" font-size="27" fill="#eee9dd">Espone una selezione su un</text><text x="1215" y="787" font-family="Arial" font-size="27" fill="#eee9dd">supporto tramite mezzi</text><text x="1215" y="827" font-family="Arial" font-size="27" fill="#eee9dd">pertinenti. La copia non</text><text x="1215" y="867" font-family="Arial" font-size="27" fill="#eee9dd">trasferisce tutto il Testament.</text><text x="75" y="1067" font-family="Arial" font-size="27" fill="#d7bb7b">DISTINGUERE SEMPRE NELLA RISPOSTA</text><rect x="75" y="1100" width="315" height="125" rx="12" fill="#172e35" stroke="#d7bb7b" stroke-width="2"/><text x="90" y="1150" font-family="Arial" font-size="25" fill="#d7bb7b">Principio originario</text><text x="90" y="1190" font-family="Arial" font-size="20" fill="#eee9dd">Sapere tecnico</text><rect x="410" y="1100" width="315" height="125" rx="12" fill="#172e35" stroke="#d7bb7b" stroke-width="2"/><text x="425" y="1150" font-family="Arial" font-size="25" fill="#d7bb7b">Ricordo personale</text><text x="425" y="1190" font-family="Arial" font-size="20" fill="#eee9dd">Esperienza ricordata</text><rect x="745" y="1100" width="315" height="125" rx="12" fill="#172e35" stroke="#d7bb7b" stroke-width="2"/><text x="760" y="1150" font-family="Arial" font-size="25" fill="#d7bb7b">Osservazione attuale</text><text x="760" y="1190" font-family="Arial" font-size="20" fill="#eee9dd">Dato acquisito</text><rect x="1080" y="1100" width="315" height="125" rx="12" fill="#172e35" stroke="#d7bb7b" stroke-width="2"/><text x="1095" y="1150" font-family="Arial" font-size="25" fill="#d7bb7b">Deduzione</text><text x="1095" y="1190" font-family="Arial" font-size="20" fill="#eee9dd">Conclusione da</text><text x="1095" y="1220" font-family="Arial" font-size="20" fill="#eee9dd">verificare</text><rect x="1415" y="1100" width="315" height="125" rx="12" fill="#172e35" stroke="#d7bb7b" stroke-width="2"/><text x="1430" y="1150" font-family="Arial" font-size="25" fill="#d7bb7b">Ignoto</text><text x="1430" y="1190" font-family="Arial" font-size="20" fill="#eee9dd">Dato assente o schermato</text><text x="75" y="1311" font-family="Arial" font-size="26" fill="#eee9dd">Nessuna informazione moderna automatica. Nessuna nuova abilità concessa dallo schema.</text><text x="75" y="1351" font-family="Arial" font-size="21" fill="#b4c2c0">Fonte: GIOCATORE_68_The_First_Testament_consultazione.md — VIS-336</text></svg>