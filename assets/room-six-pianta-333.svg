<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1400"><rect width="1400" height="1400" fill="#f4f0e6"/><rect x="70" y="70" width="1260" height="1050" fill="#eee6d5" stroke="#272d30" stroke-width="5"/><ellipse cx="700" cy="539" rx="280.0" ry="105.0" fill="#9d7956" stroke="#423b35"/><text x="700" y="518" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="22" fill="white">TAVOLO CONDIVISO</text><text x="700" y="560" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="19" fill="white">8,0 × 3,0 m — 12 posti</text><ellipse cx="963" cy="454" rx="23.1" ry="23.1" fill="#748279" stroke="#423b35"/><ellipse cx="875" cy="417" rx="23.1" ry="23.1" fill="#748279" stroke="#423b35"/><ellipse cx="761" cy="398" rx="23.1" ry="23.1" fill="#748279" stroke="#423b35"/><ellipse cx="639" cy="398" rx="23.1" ry="23.1" fill="#748279" stroke="#423b35"/><ellipse cx="525" cy="417" rx="23.1" ry="23.1" fill="#748279" stroke="#423b35"/><ellipse cx="437" cy="454" rx="23.1" ry="23.1" fill="#748279" stroke="#423b35"/><ellipse cx="437" cy="624" rx="23.1" ry="23.1" fill="#748279" stroke="#423b35"/><ellipse cx="525" cy="661" rx="23.1" ry="23.1" fill="#748279" stroke="#423b35"/><ellipse cx="639" cy="680" rx="23.1" ry="23.1" fill="#748279" stroke="#423b35"/><ellipse cx="761" cy="680" rx="23.1" ry="23.1" fill="#748279" stroke="#423b35"/><ellipse cx="875" cy="661" rx="23.1" ry="23.1" fill="#748279" stroke="#423b35"/><ellipse cx="963" cy="624" rx="23.1" ry="23.1" fill="#748279" stroke="#423b35"/><rect x="140" y="826" width="210" height="210" fill="#faf7ef" stroke="#423b35" stroke-width="3"/><text x="245" y="882" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="17" fill="#333333">CAMERINO</text><text x="245" y="917" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="16" fill="#333333">3 × 3 m</text><rect x="161" y="987" width="133.0" height="28.0" fill="#cbb18b" stroke="#423b35" stroke-width="2"/><ellipse cx="245" cy="959" rx="17.5" ry="17.5" fill="#748279" stroke="#423b35"/><line x1="350" y1="966" x2="350" y2="896" stroke="#276d89" stroke-width="7"/><rect x="1050" y="826" width="210" height="210" fill="#faf7ef" stroke="#423b35" stroke-width="3"/><text x="1155" y="882" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="17" fill="#333333">CAMERINO</text><text x="1155" y="917" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="16" fill="#333333">3 × 3 m</text><rect x="1071" y="987" width="133.0" height="28.0" fill="#cbb18b" stroke="#423b35" stroke-width="2"/><ellipse cx="1155" cy="959" rx="17.5" ry="17.5" fill="#748279" stroke="#423b35"/><line x1="1050" y1="966" x2="1050" y2="896" stroke="#276d89" stroke-width="7"/><text x="700" y="973" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="18" fill="#276d89">ANTICAMERA — ingressi scaglionati</text><line x1="350" y1="812" x2="651" y2="812" stroke="#5f6252" stroke-width="8"/><line x1="749" y1="812" x2="1050" y2="812" stroke="#5f6252" stroke-width="8"/><text x="700" y="868" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="14" fill="#333333">passaggio 1,4 m</text><line x1="490" y1="1120" x2="574" y2="1120" stroke="#f4f0e6" stroke-width="9"/><line x1="490" y1="1120" x2="490" y2="1036" stroke="#6a6d59" stroke-width="3"/><text x="532" y="1155" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="13" fill="#333333">PORTA ORDINARIA</text><line x1="826" y1="1120" x2="910" y2="1120" stroke="#f4f0e6" stroke-width="9"/><line x1="826" y1="1120" x2="826" y2="1036" stroke="#6a6d59" stroke-width="3"/><text x="868" y="1155" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="13" fill="#333333">VARCO PREDISPOSTO</text><text x="700" y="182" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="20" fill="#333333">SALA COMUNE — nessuna cabina tra i partecipanti</text><text x="700" y="231" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="17" fill="#333333">Conversazione diretta; gesti, tono e reazioni rimangono percepibili.</text><text x="700" y="28" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="22" fill="#333333">ROOM SIX — DISPOSIZIONE CONVIVIALE 333 — 18 × 15 m</text><text x="700" y="1204" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="17" fill="#333333">Dodici sedie, un unico tavolo; due camerini per prepararsi, non per assistere separati.</text><text x="700" y="1239" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="17" fill="#333333">Blu: porte dei camerini. Paraventi solo tra anticamera e sala.</text><text x="700" y="1274" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="16" fill="#333333">Copertura personale e voce alterata riducono il riconoscimento; nessuna immunità magica.</text></svg>