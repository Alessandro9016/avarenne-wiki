.0" y="657.0" class="small">1,4 km dalla casa</text><rect x="760" y="590" width="245" height="100" rx="8" fill="#465f55" stroke="#bfc5a5"/><text x="775.0" y="625.0" class="label">Ponte dei mulini vicini</text><text x="775.0" y="657.0" class="small">2,8 km dalla casa</text><path d="M180,240V330" stroke="#e8bd70" stroke-width="2" fill="none"/><path d="M295,185H380" stroke="#e8bd70" stroke-width="2" fill="none"/><path d="M295,380H380" stroke="#e8bd70" stroke-width="2" fill="none"/><path d="M610,380H760" stroke="#e8bd70" stroke-width="2" fill="none"/><path d="M180,430V590" stroke="#e8bd70" stroke-width="2" fill="none"/><path d="M610,430V530H525V590" stroke="#e8bd70" stroke-width="2" fill="none"/><path d="M880,430V590" stroke="#e8bd70" stroke-width="2" fill="none"/><text x="35.0" y="760.0" class="small">Casa → Lethorne: 23 km su strada · borgo circa 3.800 abitanti · patrimonio disperso, non tutto attorno alla residenza</text><text x="35.0" y="795.0" class="small">Nessuna etichetta di dispositivi ignoti o persone immobili: schema delle memorie del duca.</text></svg>