<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img"><title>Rovenne • casa, borgo e accessi</title><desc>Schema funzionale delle memorie del duca • non una pianta edilizia né una carta del ducato</desc><rect x="20" y="20" width="1760" height="1160" fill="#f1e8d3" stroke="#253b3c" stroke-width="2"/><rect x="32" y="32" width="1736" height="1136" fill="#f1e8d3" stroke="#986d32" stroke-width="1"/><text x="65.00" y="72.00" font-family="Georgia,serif" font-size="15" fill="#986d32" text-anchor="start">ATLAS • AVARENNE</text><text x="65.00" y="121.00" font-family="Georgia,serif" font-size="34" fill="#253b3c" font-weight="bold" text-anchor="start">Rovenne • casa, borgo e accessi</text><text x="65.00" y="157.00" font-family="Georgia,serif" font-size="17" fill="#586b69" text-anchor="start">Schema funzionale delle memorie del duca • non una pianta edilizia né una carta del ducato</text><rect x="100" y="300" width="290" height="130" fill="#ded9b8" stroke="#986d32" stroke-width="1"/><text x="116.00" y="344.00" font-family="Georgia,serif" font-size="19" fill="#253b3c" font-weight="bold" text-anchor="start">Camera di convalescenza</text><text x="116.00" y="387.00" font-family="Georgia,serif" font-size="17" fill="#253b3c" text-anchor="start">Piano primo</text><rect x="430" y="300" width="290" height="130" fill="#ded9b8" stroke="#986d32" stroke-width="1"/><text x="446.00" y="344.00" font-family="Georgia,serif" font-size="19" fill="#253b3c" font-weight="bold" text-anchor="start">Biblioteca</text><text x="446.00" y="387.00" font-family="Georgia,serif" font-size="17" fill="#253b3c" text-anchor="start">25 m dalla camera</text><rect x="760" y="300" width="290" height="130" fill="#ded9b8" stroke="#986d32" stroke-width="1"/><text x="776.00" y="344.00" font-family="Georgia,serif" font-size="19" fill="#253b3c" font-weight="bold" text-anchor="start">Ingresso e scala</text><text x="776.00" y="387.00" font-family="Georgia,serif" font-size="17" fill="#253b3c" text-anchor="start">Collegamenti interni</text><rect x="100" y="550" width="290" height="130" fill="#ded9b8" stroke="#986d32" stroke-width="1"/><text x="116.00" y="594.00" font-family="Georgia,serif" font-size="19" fill="#253b3c" font-weight="bold" text-anchor="start">Ufficio patrimoniale</text><text x="116.00" y="637.00" font-family="Georgia,serif" font-size="17" fill="#253b3c" text-anchor="start">45 m dalla camera</text><rect x="430" y="550" width="290" height="130" fill="#ded9b8" stroke="#986d32" stroke-width="1"/><text x="446.00" y="594.00" font-family="Georgia,serif" font-size="19" fill="#253b3c" font-weight="bold" text-anchor="start">Rimessa e scuderie</text><text x="446.00" y="637.00" font-family="Georgia,serif" font-size="17" fill="#253b3c" text-anchor="start">95 m dall’ingresso</text><rect x="760" y="550" width="290" height="130" fill="#ded9b8" stroke="#986d32" stroke-width="1"/><text x="776.00" y="594.00" font-family="Georgia,serif" font-size="19" fill="#253b3c" font-weight="bold" text-anchor="start">Piazza del borgo</text><text x="776.00" y="637.00" font-family="Georgia,serif" font-size="17" fill="#253b3c" text-anchor="start">620 m dalla casa</text><polyline points="390.00,365.00 430.00,365.00" fill="none" stroke="#986d32" stroke-width="2"/><polyline points="720.00,365.00 760.00,365.00" fill="none" stroke="#986d32" stroke-width="2"/><polyline points="245.00,430.00 245.00,550.00" fill="none" stroke="#986d32" stroke-width="2"/><polyline points="390.00,615.00 430.00,615.00" fill="none" stroke="#986d32" stroke-width="2"/><polyline points="720.00,615.00 760.00,615.00" fill="none" stroke="#986d32" stroke-width="2"/><rect x="1170" y="195" width="560" height="865" fill="#e8dec6" stroke="#986d32" stroke-width="1"/><text x="1195.00" y="240.00" font-family="Georgia,serif" font-size="22" fill="#253b3c" font-weight="bold" text-anchor="start">Fuori dalla residenza</text><text x="1195.00" y="282.00" font-family="Georgia,serif" font-size="17" fill="#586b69" text-anchor="start">Rovenne: borgo, 3.800 abitanti.</text><text x="1195.00" y="311.00" font-family="Georgia,serif" font-size="17" fill="#586b69" text-anchor="start">Fermata ferroviaria: 1,4 km.</text><text x="1195.00" y="340.00" font-family="Georgia,serif" font-size="17" fill="#586b69" text-anchor="start">Ponte dei mulini vicini: 2,8 km.</text><text x="1195.00" y="369.00" font-family="Georgia,serif" font-size="17" fill="#586b69" text-anchor="start"></text><text x="1195.00" y="398.00" font-family="Georgia,serif" font-size="17" fill="#586b69" text-anchor="start">Lethorne:</text><text x="1195.00" y="427.00" font-family="Georgia,serif" font-size="17" fill="#586b69" text-anchor="start">23 km su strada.</text><text x="1195.00" y="456.00" font-family="Georgia,serif" font-size="17" fill="#586b69" text-anchor="start">26 km su ferrovia.</text><text x="1195.00" y="485.00" font-family="Georgia,serif" font-size="17" fill="#586b69" text-anchor="start"></text><text x="1195.00" y="514.00" font-family="Georgia,serif" font-size="17" fill="#586b69" text-anchor="start">I collegamenti non stabiliscono</text><text x="1195.00" y="543.00" font-family="Georgia,serif" font-size="17" fill="#586b69" text-anchor="start">porte o orientamenti delle stanze.</text><polyline points="65.00,1100.00 1735.00,1100.00" fill="none" stroke="#986d32" stroke-width="1"/><text x="65.00" y="1136.00" font-family="Georgia,serif" font-size="16" fill="#586b69" text-anchor="start">Distanze di percorso ricordate • non misurare sul disegno • residenza, borgo e ducato sono tre scale diverse.</text></svg>